name: Shell package

on:
  pull_request:
    paths:
      - '.github/workflows/shell.yml'
      - 'packages/shell/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/shell.yml'
      - 'packages/shell/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.base.json'

concurrency:
  group: shell-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: Extra-Chill/homeboy-action@5b40b2b0c7167b668e8d4bd5d5ec33fcd124f1a9
        with:
          extension: nodejs
          component: packages/shell
          commands: review lint review test
          node-version: '22'
          scope: full
          pr-comment: 'false'
          auto-issue: 'false'
